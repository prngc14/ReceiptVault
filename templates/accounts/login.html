<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MMC Marketing</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        :root {
            --ink: #14213d;
            --ink-soft: #52607a;
            --ink-faint: #8b97ad;
            --accent: #1d4ed8;
            --accent-dark: #1e40af;
            --accent-tint: #eaf0ff;
            --line: #dfe5ef;
            --surface: #ffffff;
            --page: #f4f6fb;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--ink);
            background: var(--page);
            position: relative;
            overflow-x: hidden;
        }

        /* ================= MAIN PAGE ================= */

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 55px 7vw;
        }

        .layout {
            width: 100%;
            max-width: 1380px;
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(390px, 0.65fr);
            gap: 80px;
            align-items: center;
        }

        /* ================= LEFT SIDE ================= */

        .hero {
            max-width: 720px;
        }

        /* ================= BRAND ================= */

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 50px;
        }

        .brand-mark {
            width: 58px;
            height: 58px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent);
            box-shadow: 0 10px 24px rgba(29, 78, 216, 0.22);
        }

        .brand-mark svg {
            width: 31px;
            height: 31px;
            stroke: #ffffff;
        }

        .brand-name {
            font-size: 34px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -1.2px;
        }

        .brand-name .mmc {
            color: var(--ink);
        }

        .brand-name .marketing {
            color: var(--accent);
        }

        .brand-subtitle {
            margin-top: 8px;
            color: var(--ink-soft);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        /* ================= HERO TEXT ================= */

        .hero-title {
            margin: 0;
            font-size: clamp(52px, 5.4vw, 82px);
            line-height: 0.98;
            font-weight: 800;
            letter-spacing: -3.5px;
        }

        .hero-title .dark {
            color: var(--ink);
        }

        .hero-title .blue {
            color: var(--accent);
        }

        .hero-description {
            max-width: 650px;
            margin-top: 28px;
            color: var(--ink-soft);
            font-size: 17px;
            line-height: 1.7;
        }

        /* ================= ACCENT LINE ================= */

        .accent-line {
            width: 78px;
            height: 4px;
            margin-top: 30px;
            border-radius: 100px;
            background: var(--accent);
        }

        /* ================= FEATURE CHIPS ================= */

        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 48px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 17px;
            border-radius: 14px;
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--ink);
            font-size: 14px;
            font-weight: 600;
        }

        .feature-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: var(--accent-tint);
        }

        .feature-icon svg {
            width: 18px;
            height: 18px;
            stroke: var(--accent);
        }

        /* ================= LOGIN AREA ================= */

        .login-container {
            width: 100%;
            max-width: 470px;
            justify-self: end;
        }

        .login-card {
            position: relative;
            width: 100%;
            padding: 42px;
            border-radius: 28px;
            background: var(--surface);
            border: 1px solid var(--line);
            box-shadow: 0 24px 60px rgba(20, 33, 61, 0.10);
            overflow: hidden;
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--accent);
        }

        .login-title {
            margin: 8px 0 34px;
            text-align: center;
            font-size: 35px;
            font-weight: 800;
            letter-spacing: -1.3px;
            color: var(--ink);
        }

        /* ================= ALERT ================= */

        .alert-danger {
            margin-bottom: 25px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #be123c;
            font-size: 13px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 23px;
        }

        .form-label {
            display: block;
            margin-bottom: 9px;
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 19px;
            height: 19px;
            z-index: 2;
            pointer-events: none;
        }

        .input-icon svg {
            width: 100%;
            height: 100%;
            stroke: var(--ink-faint);
        }

        .form-control {
            width: 100%;
            min-height: 57px;
            padding: 14px 16px 14px 49px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: #f8faff;
            color: var(--ink) !important;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        #password {
            padding-right: 44px;
        }

        #password::-ms-reveal,
        #password::-ms-clear {
            display: none;
        }

        .form-control::placeholder {
            color: var(--ink-faint);
        }

        .form-control:focus {
            background: #ffffff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.12);
        }

        /* Chrome autofill */

        .form-control:-webkit-autofill,
        .form-control:-webkit-autofill:hover,
        .form-control:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--ink) !important;
            -webkit-box-shadow: 0 0 0 1000px #f8faff inset !important;
            transition: background-color 9999s ease-in-out 0s;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 15px;
            display: grid;
            width: 20px;
            height: 20px;
            padding: 0;
            transform: translateY(-50%);
            place-items: center;
            border: 0;
            background: transparent;
            color: var(--ink-faint);
            cursor: pointer;
            z-index: 2;
        }

        .password-toggle:hover,
        .password-toggle:focus-visible {
            color: var(--accent);
        }

        .password-toggle svg {
            width: 15px;
            height: 15px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ================= LOGIN BUTTON ================= */

        .login-button {
            display: block;
            width: 100%;
            min-height: 52px;
            margin: 3px auto 0;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2px;
            box-shadow: 0 10px 22px rgba(29, 78, 216, 0.22);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);
            background: var(--accent-dark);
            box-shadow: 0 14px 28px rgba(29, 78, 216, 0.28);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:focus-visible {
            outline: 3px solid rgba(29, 78, 216, 0.35);
            outline-offset: 2px;
        }

        /* ================= FOOTERS ================= */

        .login-footer {
            text-align: center;
            margin-top: 25px;
            color: var(--ink-faint);
            font-size: 12px;
        }

        .page-footer {
            position: fixed;
            right: 28px;
            bottom: 20px;
            z-index: 2;
            color: var(--ink-faint);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 1050px) {

            .page {
                padding: 45px 5vw;
            }

            .layout {
                grid-template-columns: 1fr 400px;
                gap: 45px;
            }

            .hero-title {
                font-size: 56px;
            }

        }

        @media (max-width: 850px) {

            .page {
                align-items: flex-start;
                padding: 45px 22px;
            }

            .layout {
                grid-template-columns: 1fr;
                gap: 45px;
            }

            .hero {
                max-width: 700px;
            }

            .login-container {
                justify-self: center;
                max-width: 500px;
            }

            .hero-title {
                font-size: clamp(45px, 10vw, 65px);
            }

            .brand {
                margin-bottom: 35px;
            }

            .page-footer {
                display: none;
            }

        }

        @media (max-width: 520px) {

            .page {
                padding: 30px 16px;
            }

            .brand-mark {
                width: 50px;
                height: 50px;
            }

            .brand-name {
                font-size: 28px;
            }

            .brand-subtitle {
                font-size: 9px;
                letter-spacing: 2px;
            }

            .hero-title {
                font-size: 45px;
                letter-spacing: -2.5px;
            }

            .hero-description {
                font-size: 14px;
            }

            .features {
                margin-top: 30px;
            }

            .feature {
                width: 100%;
            }

            .login-card {
                padding: 30px 24px;
                border-radius: 24px;
            }

            .login-title {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>

    <main class="page">

        <div class="layout">

            <!-- ================= LEFT / BRANDING ================= -->

            <section class="hero">

                <div class="brand">

                    <div class="brand-mark">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M5 21V5.5L12 3l7 2.5V21" />
                            <path d="M3 21h18" />
                            <path d="M8 8h1" />
                            <path d="M12 8h1" />
                            <path d="M16 8h1" />
                            <path d="M8 12h1" />
                            <path d="M12 12h1" />
                            <path d="M16 12h1" />
                            <path d="M10 21v-5h4v5" />
                        </svg>

                    </div>

                    <div>

                        <div class="brand-name">
                            <span class="mmc">MMC</span>
                            <span class="marketing">Marketing</span>
                        </div>

                        <div class="brand-subtitle">
                        </div>

                    </div>

                </div>

                <h1 class="hero-title">
                    <span class="dark">Smarter Records.</span>
                    <br>
                    <span class="blue">Better</span>
                    <br>
                    <span class="blue">Management.</span>
                </h1>

                <p class="hero-description">
                </p>

                <div class="accent-line"></div>

                <div class="features">

                    <!-- Manage Companies -->
                    <div class="feature">
                        <div class="feature-icon">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M3 21h18" />
                                <path d="M5 21V7l7-4 7 4v14" />
                                <path d="M8 10h1" />
                                <path d="M12 10h1" />
                                <path d="M16 10h1" />
                                <path d="M8 14h1" />
                                <path d="M12 14h1" />
                                <path d="M16 14h1" />
                                <path d="M10 21v-4h4v4" />
                            </svg>
                        </div>
                        <span>Manage Companies</span>
                    </div>

                    <!-- Track Receipts -->
                    <div class="feature">
                        <div class="feature-icon">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z" />
                                <path d="M9 8h6" />
                                <path d="M9 12h6" />
                                <path d="M9 16h3" />
                            </svg>
                        </div>
                        <span>Track Receipts</span>
                    </div>

                    <!-- Secure Records -->
                    <div class="feature">
                        <div class="feature-icon">
                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect x="4" y="10" width="16" height="11" rx="2" />
                                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                                <circle cx="12" cy="15.5" r="1" />
                                <path d="M12 16.5v2" />
                            </svg>
                        </div>
                        <span>Secure Records</span>
                    </div>

                </div>

            </section>


            <!-- ================= LOGIN ================= -->

            <section class="login-container">

                <div class="login-card">

                    <h2 class="login-title">
                        Welcome Back
                    </h2>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-danger">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">

                        {% csrf_token %}

                        <!-- USERNAME -->

                        <div class="form-group">

                            <label for="username" class="form-label">
                                Username
                            </label>

                            <div class="input-wrapper">

                                <div class="input-icon">
                                    <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    >
                                        <circle cx="12" cy="8" r="4" />
                                        <path d="M4 21a8 8 0 0 1 16 0" />
                                    </svg>
                                </div>

                                <input
                                    type="text"
                                    id="username"
                                    name="username"
                                    class="form-control"
                                    placeholder="Enter username"
                                    autocomplete="username"
                                    required
                                >

                            </div>

                        </div>

                        <!-- PASSWORD -->

                        <div class="form-group">

                            <label for="password" class="form-label">
                                Password
                            </label>

                            <div class="input-wrapper">

                                <div class="input-icon">
                                    <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke-width="1.8"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                    >
                                        <rect x="4" y="10" width="16" height="11" rx="2" />
                                        <path d="M8 10V7a4 4 0 0 1 8 0v3" />
                                        <circle cx="12" cy="15" r="1" />
                                    </svg>
                                </div>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter password"
                                    autocomplete="current-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    id="password-toggle"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    <svg
                                        class="password-eye"
                                        viewBox="0 0 24 24"
                                        aria-hidden="true"
                                    >
                                        <path d="m3 3 18 18" />
                                        <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8" />
                                        <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4-.8" />
                                    </svg>
                                </button>

                            </div>

                        </div>

                        <!-- LOGIN -->

                        <button type="submit" class="login-button">
                            Login
                        </button>

                    </form>

                    <div class="login-footer"></div>

                </div>

            </section>

        </div>

    </main>

    <div class="page-footer"></div>

    <script>
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('password-toggle');
        const passwordEye = passwordToggle.querySelector('.password-eye');

        passwordToggle.addEventListener('click', () => {
            const isPasswordVisible = passwordInput.type === 'text';
            passwordInput.type = isPasswordVisible ? 'password' : 'text';
            passwordEye.innerHTML = isPasswordVisible
                ? '<path d="m3 3 18 18" /><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.8" /><path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.7 10.7 0 0 0 4-.8" />'
                : '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" />';
            passwordToggle.setAttribute('aria-pressed', String(!isPasswordVisible));
            passwordToggle.setAttribute(
                'aria-label',
                isPasswordVisible ? 'Show password' : 'Hide password'
            );
        });
    </script>

</body>

</html>
