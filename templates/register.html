{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register Staff - ReceiptVault</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .brand {
            font-size: 30px;
            font-weight: 700;
            color: #212529;
        }

        .subtitle {
            color: #6c757d;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .register-btn {
            height: 48px;
            border-radius: 10px;
            font-weight: 600;
        }

    </style>

</head>

<body>

<div class="register-card">

    <div class="text-center mb-4">

        <div class="brand">
            ReceiptVault
        </div>

        <div class="subtitle mt-1">
            Staff Registration
        </div>

    </div>

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label fw-semibold">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter username"
                required
            >

        </div>

        <div class="mb-3">

            <label class="form-label fw-semibold">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter password"
                required
            >

        </div>

        <div class="mb-4">

            <label class="form-label fw-semibold">
                Confirm Password
            </label>

            <input
                type="password"
                name="confirm_password"
                class="form-control"
                placeholder="Confirm password"
                required
            >

        </div>

        <button
            type="submit"
            class="btn btn-primary w-100 register-btn"
        >
            Register Staff
        </button>

    </form>

    <div class="text-center mt-4">

        <span class="text-muted">
            Already have an account?
        </span>

        <a href="{% url 'login' %}" class="text-decoration-none">
            Login
        </a>

    </div>

</div>

</body>
</html>
